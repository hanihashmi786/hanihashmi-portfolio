<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hani Hashmi - Software Engineer</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <!-- Set language, direction, colour scheme and container style before
         first paint so nothing flips after the app mounts. Mirrors the
         detection in src/i18n/index.js and src/theme/index.js; keep the
         lists in step with SCHEMES / STYLES there. -->
    <script>
      (function () {
        var root = document.documentElement;
        var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };

        var codes = ['en', 'ar', 'ur'];
        var lang = get('lang');
        if (codes.indexOf(lang) < 0) {
          var nav = (navigator.language || '').slice(0, 2).toLowerCase();
          lang = codes.indexOf(nav) < 0 ? 'en' : nav;
        }
        root.lang = lang;
        root.dir = lang === 'en' ? 'ltr' : 'rtl';

        var schemes = ['gold', 'mono', 'dark-mono', 'andromeda', 'gruvbox-dark', 'gruvbox-light', 'monokai', 'solarized-dark', 'solarized-light', 'vscode-dark'];
        var light = ['mono', 'gruvbox-light', 'solarized-light'];
        var scheme = get('scheme');
        if (schemes.indexOf(scheme) < 0) scheme = get('theme') === 'mono' ? 'mono' : 'gold';
        root.setAttribute('data-scheme', scheme);
        root.setAttribute('data-mode', light.indexOf(scheme) < 0 ? 'dark' : 'light');

        var styles = ['minimal', 'material', 'brutal', 'glass', 'soft'];
        var style = get('style');
        root.setAttribute('data-style', styles.indexOf(style) < 0 ? 'minimal' : style);
      })();
    </script>
    <!-- Browsers only fetch a font once text needs it, so the Arabic and Urdu
         faces cost English visitors nothing beyond this stylesheet. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
